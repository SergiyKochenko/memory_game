<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Memory Game</title>
    <link href="favicon.ico" rel="icon" type="image/x-icon" />

    <link href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap"
          rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <h1 style="font-family: 'Montserrat', sans-serif; color: #4CAF50; text-align: center; margin-bottom: 10px;">
            Coloured Circles
        </h1>
        <h2 style="font-family: 'Montserrat', sans-serif; color: #2196F3; text-align: center; margin-top: 0;">
            Memory Game
        </h2>
    </div>
    <div class="container">
        <div class="circle circle1" data-listener="false" id="button1"></div>
        <div class="circle circle2" data-listener="false" id="button2"></div>
        <div class="circle circle3" data-listener="false" id="button3"></div>
        <div class="circle circle4" data-listener="false" id="button4"></div>
        <div class="scorebox" id="score">0</div>
        <button class="button" onclick="newGame()">new game</button>
    </div>
    <script src="scripts/game.js" type="text/javascript"></script>
</body>
</html>
